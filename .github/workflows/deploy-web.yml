name: Build and push web image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # registry.digitalocean.com/pngmkr/rmbg
  DOCR_NAME: pngmkr
  IMAGE_NAME: rmbg
  VITE_SITE_ORIGIN: https://png-maker.app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registries login "${DOCR_NAME}" --expiry-seconds 1200

      - name: Set image tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "image=registry.digitalocean.com/${DOCR_NAME}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
          build-args: |
            VITE_SITE_ORIGIN=${{ env.VITE_SITE_ORIGIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
