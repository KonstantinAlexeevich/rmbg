server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # За edge-прокси DO: не подставлять :8080 и http в Location
    absolute_redirect off;
    port_in_redirect off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ORT / SharedArrayBuffer — см. docs/08-decisions.md Р-08
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    gzip on;
    gzip_types text/css application/javascript application/wasm application/json image/svg+xml;
    gzip_min_length 1024;

    # ORT: dynamic import() .mjs — нужен JS MIME (в mime.types alpine часто нет)
    location ~* \.mjs$ {
        default_type application/javascript;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /ort/ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
