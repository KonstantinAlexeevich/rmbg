# App Platform: образ из DOCR, автодеплой при push тега latest.
# DNS у Porkbun (не DigitalOcean) — без `zone`, записи вручную:
#   ALIAS @  → pngmkr-voozt.ondigitalocean.app
#   CNAME www → pngmkr-voozt.ondigitalocean.app
#
# GitHub: secrets.DIGITALOCEAN_ACCESS_TOKEN

name: rmbg
region: fra
domains:
  - domain: png-maker.app
    type: PRIMARY
  - domain: www.png-maker.app
    type: ALIAS
services:
  - name: web
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    image:
      registry_type: DOCR
      registry: pngmkr
      repository: rmbg
      tag: latest
      deploy_on_push:
        enabled: true
