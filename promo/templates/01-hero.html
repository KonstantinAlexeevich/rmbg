<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PNG Maker — hero</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      .stage-head {
        padding-top: 36px;
      }

      .flow {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 20px;
        height: 560px;
        padding: 0 40px;
      }

      .stack {
        position: relative;
        flex-shrink: 0;
        z-index: 3;
      }

      .stack.in {
        width: 176px;
        height: 300px;
      }

      .stack.in .card {
        position: absolute;
        background: #fff;
        border-radius: 5px;
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.28);
        overflow: hidden;
        border: 3px solid #fff;
      }

      .stack.in .card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .stack.in .c1 {
        width: 128px;
        height: 86px;
        left: 12px;
        top: 24px;
        transform: rotate(-8deg);
        z-index: 1;
      }
      .stack.in .c2 {
        width: 92px;
        height: 138px;
        left: 72px;
        top: 6px;
        transform: rotate(6deg);
        z-index: 2;
      }
      .stack.in .c3 {
        width: 108px;
        height: 108px;
        left: 14px;
        top: 116px;
        transform: rotate(2deg);
        z-index: 3;
      }
      .stack.in .c4 {
        width: 134px;
        height: 90px;
        left: 34px;
        top: 188px;
        transform: rotate(-4deg);
        z-index: 4;
      }

      .arrow {
        width: 36px;
        height: 36px;
      }

      .shot-scene {
        width: 700px;
        height: 460px;
        flex-shrink: 0;
      }

      .shot {
        width: 660px;
        height: 412px;
      }

      .stack.out {
        width: 180px;
        height: 380px;
      }

      .stack.out .card {
        position: absolute;
        width: 88px;
        height: 88px;
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
        border: 3px solid rgba(255, 255, 255, 0.95);
      }

      .stack.out .card img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      /* ~78px step on 88px cards → only ~10px overlap, each cutout readable */
      .stack.out .o1 {
        top: 0;
        left: 0;
        z-index: 1;
      }
      .stack.out .o2 {
        top: 78px;
        left: 28px;
        z-index: 2;
      }
      .stack.out .o3 {
        top: 156px;
        left: 56px;
        z-index: 3;
      }
      .stack.out .o4 {
        top: 234px;
        left: 84px;
        z-index: 4;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="stage-head">
        <h1>Remove backgrounds in bulk</h1>
        <p>On-device AI · nothing is uploaded · transparent PNG</p>
      </div>

      <div class="flow">
        <div class="stack in">
          <div class="card c1"><img src="../samples/in/helmet.jpg" alt="" /></div>
          <div class="card c2"><img src="../samples/in/plant.jpg" alt="" /></div>
          <div class="card c3"><img src="../samples/in/mug.jpg" alt="" /></div>
          <div class="card c4"><img src="../samples/in/sneaker.jpg" alt="" /></div>
        </div>

        <svg class="arrow" viewBox="0 0 56 56" aria-hidden="true">
          <path
            d="M8 28h32M30 14l16 14-16 14"
            fill="none"
            stroke="#fff"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

        <div class="shot-scene">
          <div class="shot">
            <img src="../captures/studio.png" alt="PNG Maker studio" />
          </div>
        </div>

        <svg class="arrow" viewBox="0 0 56 56" aria-hidden="true">
          <path
            d="M8 28h32M30 14l16 14-16 14"
            fill="none"
            stroke="#fff"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

        <div class="stack out">
          <div class="card o1 checkerboard"><img src="../samples/out/helmet.png" alt="" /></div>
          <div class="card o2 checkerboard"><img src="../samples/out/sneaker.png" alt="" /></div>
          <div class="card o3 checkerboard"><img src="../samples/out/plant.png" alt="" /></div>
          <div class="card o4 checkerboard"><img src="../samples/out/mug.png" alt="" /></div>
        </div>
      </div>
    </div>
  </body>
</html>
