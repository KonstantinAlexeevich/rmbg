<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PNG Maker — canvas size</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      .row {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 72px;
        margin-top: 40px;
      }

      /* menu.png is a 2× shot of the 287×805 export panel — zoomed past 1:1 to stay legible */
      .win {
        --cw: 287;
        --ch: 805;
        --k: 1.57;
        margin: 0;
        flex-shrink: 0;
      }

      .set {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        flex-shrink: 0;
      }

      .set-grid {
        display: grid;
        grid-template-columns: repeat(2, 244px);
        gap: 18px;
      }

      .set-grid > div {
        height: 244px;
      }

      .set span {
        font-size: 17px;
        font-weight: 550;
        letter-spacing: -0.01em;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="stage-head">
        <h1>One canvas size for the whole set</h1>
        <p>Custom size · padding · transparent or solid · a folder per preset</p>
      </div>
      <div class="row">
        <div class="win fade-bottom">
          <div class="win-slice" style="--y: 85; --h: 355">
            <img src="../captures/menu.png" alt="Export layout settings" />
          </div>
        </div>
        <div class="set">
          <div class="set-grid">
            <div class="cutout checkerboard"><img src="../samples/out/sneaker.png" alt="" /></div>
            <div class="cutout checkerboard"><img src="../samples/out/mug.png" alt="" /></div>
            <div class="cutout checkerboard"><img src="../samples/out/helmet.png" alt="" /></div>
            <div class="cutout checkerboard"><img src="../samples/out/plant.png" alt="" /></div>
          </div>
          <span>Every image lands on the same 500 × 500 canvas</span>
        </div>
      </div>
    </div>
  </body>
</html>
