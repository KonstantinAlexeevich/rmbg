<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PNG Maker — edges</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      .win {
        --k: 0.79;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="stage-head">

      <div class="win">
        <div class="win-slice" style="--y: 0; --h: 800">
          <img src="../captures/before-after.png" alt="Before and after viewer" />
        </div>
      </div>
    </div>
  </body>
