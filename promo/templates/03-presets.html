<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PNG Maker — presets</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      /* Modal + grid (0–530) and footer bar (745–800); the dimmed idle area is dropped */
      .win {
        --k: 0.922;
        margin-top: 56px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="stage-head">
        <h1>Export the whole batch as a ZIP</h1>
        <p>Pick the presets · each one lands in its own folder</p>
      </div>
      <div class="win">
        <div class="win-slice" style="--y: 0; --h: 530">
          <img src="../captures/bulk-export.png" alt="Export presets" />
        </div>
        <div class="win-slice" style="--y: 745; --h: 55">
          <img src="../captures/bulk-export.png" alt="" />
        </div>
      </div>
    </div>
  </body>
</html>
