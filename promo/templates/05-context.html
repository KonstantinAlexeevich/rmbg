<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PNG Maker — context menu</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      .scene {
        position: relative;
        z-index: 2;
        display: flex;
        justify-content: center;
        margin-top: 22px;
        padding: 0 40px;
      }

      /* Lightweight “webpage” chrome around the photo */
      .page {
        position: relative;
        width: 920px;
        height: 560px;
        background: #f4f4f5;
        border-radius: 14px;
        box-shadow:
          0 30px 60px rgba(0, 0, 0, 0.32),
          0 0 0 1px rgba(255, 255, 255, 0.3);
        overflow: hidden;
      }

      .page-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 14px;
        background: #e4e4e7;
        border-bottom: 1px solid #d4d4d8;
      }

      .page-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #a1a1aa;
      }

      .page-dot:nth-child(1) {
        background: #f87171;
      }
      .page-dot:nth-child(2) {
        background: #fbbf24;
      }
      .page-dot:nth-child(3) {
        background: #4ade80;
      }

      .page-url {
        flex: 1;
        margin-left: 8px;
        height: 24px;
        border-radius: 6px;
        background: #fff;
        border: 1px solid #d4d4d8;
        color: #71717a;
        font-size: 12px;
        line-height: 24px;
        padding: 0 10px;
        overflow: hidden;
        white-space: nowrap;
      }

      .page-body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: calc(100% - 40px);
        padding: 28px 40px;
        background:
          radial-gradient(ellipse 80% 60% at 50% 40%, #fff 0%, #f4f4f5 70%),
          #f4f4f5;
      }

      .photo-wrap {
        position: relative;
        width: 520px;
        height: 390px;
        border-radius: 10px;
        overflow: hidden;
        box-shadow:
          0 16px 36px rgba(0, 0, 0, 0.18),
          0 0 0 1px rgba(0, 0, 0, 0.06);
        background: #fff;
      }

      .photo-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Chrome-like context menu (macOS) */
      .menu {
        position: absolute;
        left: 470px;
        top: 210px;
        z-index: 5;
        width: 248px;
        padding: 5px 0;
        background: #fff;
        border-radius: 8px;
        box-shadow:
          0 12px 28px rgba(0, 0, 0, 0.22),
          0 0 0 1px rgba(0, 0, 0, 0.08);
        font-size: 13.5px;
        color: #1f1f1f;
        line-height: 1;
      }

      .menu-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 30px;
        padding: 0 14px 0 16px;
        white-space: nowrap;
      }

      .menu-item.muted {
        color: #52525b;
      }

      .menu-item.hover {
        background: #0b63f6;
        color: #fff;
      }

      .menu-item .chev {
        width: 7px;
        height: 11px;
        margin-left: 18px;
        opacity: 0.85;
      }

      .menu-sep {
        height: 1px;
        margin: 5px 10px;
        background: #e4e4e7;
      }

      .submenu {
        position: absolute;
        left: calc(100% - 4px);
        top: 98px;
        width: 168px;
        padding: 5px 0;
        background: #fff;
        border-radius: 8px;
        box-shadow:
          0 12px 28px rgba(0, 0, 0, 0.22),
          0 0 0 1px rgba(0, 0, 0, 0.08);
        color: #1f1f1f;
      }

      .cursor {
        position: absolute;
        left: 668px;
        top: 318px;
        z-index: 6;
        width: 28px;
        height: 28px;
        filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.35));
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="stage-head">
        <h1>Right-click any image</h1>
        <p>Save without background</p>
      </div>

      <div class="scene">
        <div class="page">
          <div class="page-bar">
            <span class="page-dot"></span>
            <span class="page-dot"></span>
            <span class="page-dot"></span>
            <div class="page-url">https://shop.example/products/neon-runner</div>
          </div>
          <div class="page-body">
            <div class="photo-wrap">
              <img src="../samples/in/1-sneaker.jpg" alt="Product photo" />
            </div>
          </div>

          <div class="menu" aria-hidden="true">
            <div class="menu-item muted">Open Image in New Tab</div>
            <div class="menu-item muted">Copy Image</div>
            <div class="menu-sep"></div>
            <div class="menu-item">Add to PNG Maker</div>
            <div class="menu-item hover">
              <span>Save without background</span>
              <svg class="chev" viewBox="0 0 7 11" aria-hidden="true">
                <path
                  d="M1.2 1.2l4.2 4.3-4.2 4.3"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
            <div class="submenu">
              <div class="menu-item">500px 1:1</div>
              <div class="menu-item">Original</div>
              <div class="menu-item">720p</div>
              <div class="menu-item">Shop white</div>
            </div>
          </div>

          <!-- Classic arrow cursor tip on the hovered row -->
          <svg class="cursor" viewBox="0 0 28 28" aria-hidden="true">
            <path
              d="M5 3.5v20.2l5.2-5.1 3.1 7.4 2.8-1.2-3.1-7.3H20L5 3.5z"
              fill="#fff"
              stroke="#111"
              stroke-width="1.4"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>
    </div>
  </body>
</html>
