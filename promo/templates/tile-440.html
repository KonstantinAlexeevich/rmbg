<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PNG Maker — small promo tile</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      .tile {
        width: 440px;
        height: 280px;
        background: var(--blue-600);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 24px;
        color: #fff;
      }

      .tile::before {
        content: '';
        position: absolute;
        inset: -30%;
        background: radial-gradient(
          ellipse 60% 50% at 50% 35%,
          rgba(255, 255, 255, 0.18) 0%,
          transparent 60%
        );
        pointer-events: none;
      }

      .tile::after {
        content: '';
        position: absolute;
        inset: 0;
        opacity: 0.05;
        background-image:
          linear-gradient(45deg, #fff 25%, transparent 25%),
          linear-gradient(-45deg, #fff 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #fff 75%),
          linear-gradient(-45deg, transparent 75%, #fff 75%);
        background-size: 40px 40px;
        background-position:
          0 0,
          0 20px,
          20px -20px,
          -20px 0;
        pointer-events: none;
      }

      .wordmark {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .wordmark img {
        width: 50px;
        height: 50px;
        border-radius: 11px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      }

      .wordmark h1 {
        font-size: 36px;
        font-weight: 750;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      .tagline {
        position: relative;
        z-index: 1;
        margin-top: 8px;
        font-size: 18px;
        font-weight: 550;
        opacity: 0.92;
        letter-spacing: -0.01em;
      }

      .pair {
        position: relative;
        z-index: 1;
        margin-top: 16px;
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .pair > div:not(.arrow-wrap) {
        width: 122px;
        height: 122px;
      }

      .arrow {
        width: 32px;
        height: 32px;
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="wordmark">
        <img src="icon-128.png" alt="" width="50" height="50" />
        <h1>PNG Maker</h1>
      </div>
      <div class="tagline">Bulk background remover</div>
      <div class="pair">
        <div class="photo"><img src="../samples/in/sneaker.jpg" alt="" /></div>
        <svg class="arrow" viewBox="0 0 56 56" aria-hidden="true">
          <path
            d="M8 28h32M30 14l16 14-16 14"
            fill="none"
            stroke="#fff"
            stroke-width="6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <div class="cutout checkerboard"><img src="../samples/out/sneaker.png" alt="" /></div>
      </div>
    </div>
  </body>
</html>
