<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PNG Maker — exports</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      /* Grid fills the capture here, so the whole window is shown */
      .win {
        --k: 0.79;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="stage-head">
        <h1>Export the whole batch as a ZIP</h1>
        <p>Pick the exports · each one lands in its own folder</p>
      </div>
      <div class="win">
        <div class="win-slice" style="--y: 0; --h: 800">
          <img src="../captures/export.png" alt="Exports" />
        </div>
      </div>
    </div>
  </body>
</html>
