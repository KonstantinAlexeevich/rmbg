<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PNG Maker — canvas size</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      .row {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 68px;
        margin-top: 76px;
      }

      /* menu-solid.png is a 2× shot of the 287×916 sidebar — zoomed past 1:1 to stay legible */
      .win {
        --cw: 287;
        --ch: 916;
        --k: 1.256;
        margin: 0;
        flex-shrink: 0;
      }

      /* Crop lands just under the Padding label — keep the fade off the text */
      .win.fade-bottom::after {
        height: 14px;
      }

      .set {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        flex-shrink: 0;
      }

      /* Same two exports side by side — left transparent, right on a solid color */
      .set-grid {
        display: grid;
        grid-template-columns: repeat(2, 340px);
        grid-template-rows: auto 191px 191px;
        gap: 20px;
      }

      .set-grid .col-label {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
        opacity: 0.88;
        text-align: center;
        margin-bottom: -4px;
      }

      .set-grid .solid {
        background: #fff;
      }

      .set .note {
        font-size: 17px;
        font-weight: 550;
        letter-spacing: -0.01em;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="stage-head">
        <h1>One canvas size for the whole set</h1>
        <p>Custom size · padding · transparent PNG or a solid color</p>
      </div>
      <div class="row">
        <div class="win fade-bottom">
          <div class="win-slice" style="--y: 115; --h: 409">
            <img src="../captures/menu-solid.png" alt="Export canvas and background settings" />
          </div>
        </div>
        <div class="set">
          <div class="set-grid">
            <span class="col-label">Transparent</span>
            <span class="col-label">Solid color</span>
            <div class="cutout checkerboard"><img src="../samples/out/sneaker.png" alt="" /></div>
            <div class="cutout solid"><img src="../samples/out/sneaker.png" alt="" /></div>
            <div class="cutout checkerboard"><img src="../samples/out/plant.png" alt="" /></div>
            <div class="cutout solid"><img src="../samples/out/plant.png" alt="" /></div>
          </div>
          <span class="note">Every export lands on the same canvas size</span>
        </div>
      </div>
    </div>
  </body>
</html>
