<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PNG Maker — hero</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      /* Grid + exports list (0–440) and footer bar (745–800); the idle middle is dropped */
      .win {
        --k: 0.87;
        margin-top: 20px;
      }

      .flow {
        position: relative;
        z-index: 2;
        margin-top: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }

      .group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .group-row {
        display: flex;
        gap: 10px;
      }

      .group-row > div {
        width: 104px;
        height: 104px;
      }

      .group span {
        font-size: 16px;
        font-weight: 550;
        letter-spacing: -0.01em;
        opacity: 0.9;
      }

      .arrow {
        width: 40px;
        height: 40px;
        margin-bottom: 26px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="stage-head">
        <h1>Remove backgrounds in bulk</h1>
        <p>On-device AI · nothing is uploaded · transparent PNG</p>
      </div>

      <div class="win">
        <div class="win-slice" style="--y: 0; --h: 440">
          <img src="../captures/studio.png" alt="PNG Maker studio" />
        </div>
        <div class="win-slice" style="--y: 745; --h: 55">
          <img src="../captures/studio.png" alt="" />
        </div>
      </div>

      <div class="flow">
        <div class="group">
          <div class="group-row">
            <div class="photo"><img src="../samples/in/helmet.jpg" alt="" /></div>
            <div class="photo"><img src="../samples/in/sneaker.jpg" alt="" /></div>
            <div class="photo"><img src="../samples/in/plant.jpg" alt="" /></div>
            <div class="photo"><img src="../samples/in/mug.jpg" alt="" /></div>
          </div>
          <span>Drop your photos</span>
        </div>

        <svg class="arrow" viewBox="0 0 56 56" aria-hidden="true">
          <path
            d="M8 28h32M30 14l16 14-16 14"
            fill="none"
            stroke="#fff"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

        <div class="group">
          <div class="group-row">
            <div class="cutout checkerboard"><img src="../samples/out/helmet.png" alt="" /></div>
            <div class="cutout checkerboard"><img src="../samples/out/sneaker.png" alt="" /></div>
            <div class="cutout checkerboard"><img src="../samples/out/plant.png" alt="" /></div>
            <div class="cutout checkerboard"><img src="../samples/out/mug.png" alt="" /></div>
          </div>
          <span>Get transparent PNGs</span>
        </div>
      </div>
    </div>
  </body>
</html>
