<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PNG Maker — sidebar</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      .row {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 48px;
        margin-top: 20px;
        height: 580px;
        padding: 0 48px;
      }

      .samples {
        display: flex;
        flex-direction: column;
        gap: 20px;
        flex-shrink: 0;
      }

      .samples .card {
        width: 168px;
        height: 168px;
        border-radius: 10px;
        overflow: hidden;
        border: 3px solid rgba(255, 255, 255, 0.95);
        box-shadow: 0 14px 28px rgba(0, 0, 0, 0.28);
      }

      .samples .card img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        background: transparent;
      }

      .shot-scene {
        width: 320px;
        height: 560px;
        flex-shrink: 0;
      }

      /* menu.png is tall (~574×1610) — keep aspect, no crop */
      .shot {
        width: 280px;
        height: 540px;
        transform: rotateY(-3deg) rotateX(1deg);
      }

      .shot img {
        object-fit: contain;
        object-position: top center;
        background: #fafafa;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="stage-head">
        <h1>One canvas size for the whole set</h1>
        <p>Custom size · padding · transparent or solid · a folder per preset</p>
      </div>
      <div class="row">
        <div class="samples">
          <div class="card checkerboard">
            <img src="../samples/out/sneaker.png" alt="" />
          </div>
          <div class="card checkerboard">
            <img src="../samples/out/mug.png" alt="" />
          </div>
        </div>
        <div class="shot-scene">
          <div class="shot">
            <img src="../captures/menu.png" alt="Export layout settings" />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
